<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#09090f" />
<title>FARCIPAL EYE</title>
<meta name="description" content="Farcipal Eye — тихий концепт: глаз в темноте, который смотрит, ищет и находит." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <a class="brand" href="#" aria-label="Farcipal Eye">
    <svg class="mark" viewBox="-15 -15 30 30" aria-hidden="true">
      <defs>
        <linearGradient id="markStroke" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#eafff1" />
          <stop offset=".45" stop-color="#3dcf6f" />
          <stop offset="1" stop-color="#16562f" />
        </linearGradient>
        <radialGradient id="markCore">
          <stop offset="0" stop-color="#3dcf6f" stop-opacity=".9" />
          <stop offset="1" stop-color="#3dcf6f" stop-opacity="0" />
        </radialGradient>
      </defs>
      <circle r="13.6" fill="#07090e" stroke="url(#markStroke)" stroke-width="1" />
      <g id="markOrbit"><circle r="13.6" fill="none" stroke="#eafff1" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="6 80" opacity="0" id="markOrbitArc" /></g>
      <path id="markBlades" fill="none" stroke="url(#markStroke)" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round" />
      <circle id="markCoreDot" r="3" fill="url(#markCore)" opacity=".5" />
    </svg>
    <span class="brand-name">FARCIPAL</span>
    <span class="brand-div" aria-hidden="true"></span>
    <span class="brand-sub">eye</span>
  </a>
  <div class="top-right">
    <time class="clock" id="clock">00:00:00</time>
    <span class="pill"><span class="dot" id="pillDot" data-s="idle"></span><span id="pillText">наблюдение</span></span>
  </div>
</header>

<main>
  <section class="hero" aria-label="Глаз">
    <div class="scene" id="scene">
      <svg id="eye" viewBox="0 0 1000 480" role="img" aria-label="Контур глаза, реагирующий на поиск">
        <defs>
          <clipPath id="eyeClip"><path id="clipShape" /></clipPath>
          <radialGradient id="irisFill" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#0a2716" />
            <stop offset="55%" stop-color="#071a0f" />
            <stop offset="88%" stop-color="#040e08" />
            <stop offset="100%" stop-color="#020604" />
          </radialGradient>
          <linearGradient id="lidShade" gradientUnits="userSpaceOnUse" x1="0" y1="64" x2="0" y2="215">
            <stop offset="0%" stop-color="#000" stop-opacity=".92" />
            <stop offset="38%" stop-color="#000" stop-opacity=".62" />
            <stop offset="72%" stop-color="#000" stop-opacity=".22" />
            <stop offset="100%" stop-color="#000" stop-opacity="0" />
          </linearGradient>
          <filter id="shadeBlur" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="9" /></filter>
          <linearGradient id="tearFill" gradientUnits="userSpaceOnUse" x1="0" y1="400" x2="0" y2="640">
            <stop offset="0" style="stop-color:var(--t1)" stop-opacity="0" />
            <stop offset=".07" style="stop-color:var(--t1)" stop-opacity=".92" />
            <stop offset=".5" style="stop-color:var(--t2)" stop-opacity=".82" />
            <stop offset="1" style="stop-color:var(--t2)" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="tearEdge" gradientUnits="userSpaceOnUse" x1="0" y1="400" x2="0" y2="640">
            <stop offset="0" style="stop-color:var(--te)" stop-opacity="0" />
            <stop offset=".1" style="stop-color:var(--te)" stop-opacity=".75" />
            <stop offset=".8" style="stop-color:var(--te)" stop-opacity=".18" />
            <stop offset="1" style="stop-color:var(--te)" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="tearCoreFill" gradientUnits="userSpaceOnUse" x1="0" y1="400" x2="0" y2="640">
            <stop offset="0" stop-color="#e6fff0" stop-opacity="0" />
            <stop offset=".14" stop-color="#e6fff0" stop-opacity=".5" />
            <stop offset=".65" stop-color="#e6fff0" stop-opacity=".12" />
            <stop offset="1" stop-color="#e6fff0" stop-opacity="0" />
          </linearGradient>
          <filter id="tearGlow" x="-300%" y="-10%" width="700%" height="120%"><feGaussianBlur stdDeviation="7" /></filter>
          <filter id="dustBlur" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="1.4" /></filter>
          <filter id="blur20" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="20" /></filter>
          <filter id="sigGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.6" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>

        <g id="dustFar"></g>
        <g id="glowMove" style= "display:none"><circle id="glow" r="150" fill="none" stroke="#3dcf6f" stroke-width="22" filter="url(#blur20)" opacity=".1" /></g>
        <g id="lidsBack"><path id="sclera" fill="#02050a" fill-opacity=".5" /></g>

        <g clip-path="url(#eyeClip)">
          <g id="irisMove">
            <g id="irisScale">
              <circle r="168" fill="url(#irisFill)" />
              <g id="fibers"></g>
              <circle id="collarette" r="96" fill="none" stroke="#2a9a52" stroke-opacity=".14" stroke-width="1" stroke-dasharray="2 5" />
              <g id="sweepA"><circle r="148" fill="none" stroke="#5cf08e" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="80 900" /></g>
              <g id="sweepB"><circle r="122" fill="none" stroke="#5cf08e" stroke-width="1" stroke-linecap="round" stroke-dasharray="34 900" /></g>
              <g id="signals" filter="url(#sigGlow)"></g>
              <circle r="166" fill="none" stroke="#000" stroke-opacity=".55" stroke-width="10" />
              <circle r="168" fill="none" stroke="#3dcf6f" stroke-opacity=".7" stroke-width="1.1" />
              <g id="pupilMove">
                <circle id="pupil" r="58" fill="#010203" stroke="#3dcf6f" stroke-opacity=".75" stroke-width="1" />
              </g>
              <ellipse cx="-34" cy="-40" rx="8" ry="5.5" fill="#a9c2b0" opacity=".26" transform="rotate(-28 -34 -40)" />
            </g>
          </g>
          <path id="shadow" fill="url(#lidShade)" filter="url(#shadeBlur)" />
        </g>

        <g id="rings"></g>

        <g id="tear" aria-hidden="true">
          <path id="tearGlowPath" fill="url(#tearFill)" filter="url(#tearGlow)" opacity=".34" />
          <path id="tearBody" fill="url(#tearFill)" stroke="url(#tearEdge)" stroke-width=".9" stroke-linejoin="round" />
          <path id="tearCore" fill="url(#tearCoreFill)" />
          <ellipse id="tearDrop" rx="1.6" ry="11" fill="#c8ffdc" opacity="0" filter="url(#sigGlow)" />
        </g>
        <g id="dustNear" filter="url(#dustBlur)"></g>

        <g id="lidsFront" fill="none" stroke-linecap="round">
          <path id="upperLid" stroke="#3dcf6f" stroke-width="2" />
          <path id="lowerLid" stroke="#3dcf6f" stroke-width="1.5" stroke-opacity=".9" />
        </g>
      </svg>
    </div>

    <div class="search-wrap">
      <form class="search" id="form" role="search" autocomplete="off">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label for="q" class="sr-only">Запрос</label>
        <input id="q" name="q" type="text" placeholder="ФИО, email, ник или ссылка VK" spellcheck="false" />
        <button class="btn" id="btn" type="submit">Найти</button>
      </form>
      <div class="progress" id="progress" aria-hidden="true"><i></i></div>
      <div class="status" role="status" aria-live="polite">
        <span class="dot" id="statusDot" data-s="idle"></span>
        <span id="statusText">ожидание</span>
        <span class="timer" id="timer">00:00.000</span>
      </div>
      <div class="history" id="history" aria-label="История запросов"></div>
    </div>
  </section>

  <section class="results" aria-label="Результаты">
    <div>
      <p class="section-label">журнал</p>
      <div class="log" id="log"><p><time>--:--:--.---</time>ожидание ввода</p></div>
    </div>
    <div>
      <p class="section-label">наблюдения</p>
      <div class="cards" id="cards"><p class="placeholder">Пока ничего не увидено.</p></div>
    </div>
  </section>
</main>

<footer>farcipal · prod. by <b>apomous</b></footer>

<noscript><p style="padding:24px;color:#6d7288;text-align:center">Для работы интерфейса нужен JavaScript.</p></noscript>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
